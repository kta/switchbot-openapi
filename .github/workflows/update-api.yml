name: Update OpenAPI Specification

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract changed sections from README
        id: extract
        run: |
          if node scripts/extract-sections.js; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Update device schemas with GitHub Copilot
        if: steps.extract.outputs.changes_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🤖 Updating device schemas using GitHub Copilot..."

          # Extract unique device types from changed sections
          DEVICES=$(jq -r '.[].device' scripts/changed-sections.json | sort -u)

          if [ -z "$DEVICES" ]; then
            echo "No devices to update"
            exit 0
          fi

          # Update each changed device
          for device in $DEVICES; do
            echo "Updating $device..."
            node scripts/update-device.js "$device" || echo "⚠️  Failed to update $device"
          done

          echo "✅ Device schema updates completed"

      - name: Bundle, validate OpenAPI spec, and generate MCP server
        run: npm run build

      - name: Create Pull Request
        if: steps.extract.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update OpenAPI spec from upstream README'
          title: 'Update OpenAPI Specification'
          body: |
            ## Automated OpenAPI Update

            This PR was automatically generated based on changes detected in the
            [official SwitchBot README](https://github.com/OpenWonderLabs/SwitchBotAPI).

            ### Changes
            See `scripts/changed-sections.json` for details on what sections were updated.

            ### Checklist
            - [ ] Review generated schemas for accuracy
            - [ ] Verify bundle builds successfully
            - [ ] Test with sample API client generation

            ---
            🤖 Generated by GitHub Actions
          branch: update-openapi-spec
          delete-branch: true
          labels: |
            automated
            openapi
