openapi: 3.1.0
info:
  title: SwitchBot API
  description: |
    Official OpenAPI specification for SwitchBot API v1.1

    This specification is automatically synchronized with the official SwitchBot README documentation.

    For the latest official documentation, visit: https://github.com/OpenWonderLabs/SwitchBotAPI
  version: 1.1.0
  contact:
    name: SwitchBot API Support
    url: https://github.com/OpenWonderLabs/SwitchBotAPI
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.switch-bot.com/v1.1
    description: Production API Server
security:
  - SwitchBotAuth: []
tags:
  - name: Devices
    description: Device management and control
  - name: Scenes
    description: Scene management and execution
  - name: Webhook
    description: Webhook configuration and management
paths:
  /devices:
    get:
      tags:
        - Devices
      summary: Get device list
      description: |
        Retrieve a list of all devices associated with your SwitchBot account.

        The response includes physical devices, virtual infrared remote devices,
        and manually created scenes.

        **Note:** The response structure varies by device type. Each device type
        has specific properties in the response body.
      operationId: getDevices
      responses:
        '200':
          description: Device list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          deviceList:
                            type: array
                            description: Array of physical devices
                            items:
                              $ref: '#/components/schemas/DeviceBase'
                          infraredRemoteList:
                            type: array
                            description: Array of virtual infrared remote devices
                            items:
                              $ref: '#/components/schemas/DeviceBase'
              examples:
                success:
                  value:
                    statusCode: 100
                    message: success
                    body:
                      deviceList:
                        - deviceId: 500291B269BE
                          deviceName: Living Room Humidifier
                          deviceType: Humidifier
                          hubDeviceId: '000000000000'
                          enableCloudService: true
                      infraredRemoteList:
                        - deviceId: 02-202008110034-13
                          deviceName: Living Room Air Conditioner
                          deviceType: Air Conditioner
                          hubDeviceId: FA7310762361
                          enableCloudService: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /devices/{deviceId}/status:
    get:
      tags:
        - Devices
      summary: Get device status
      description: |
        Retrieve the current status of a specific device.

        The status response structure varies significantly by device type.
        Each device type returns different properties in the body.

        **Note:** Some devices may not support status retrieval.
      operationId: getDeviceStatus
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200':
          description: Device status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      body:
                        type: object
                        description: Status data (structure varies by device type)
              examples:
                bot:
                  value:
                    statusCode: 100
                    message: success
                    body:
                      deviceId: '210'
                      deviceType: Bot
                      power: 'on'
                      battery: 100
                humidifier:
                  value:
                    statusCode: 100
                    message: success
                    body:
                      deviceId: 500291B269BE
                      deviceType: Humidifier
                      power: 'on'
                      humidity: 52
                      temperature: 26.2
                      nebulizationEfficiency: 100
                      auto: true
                      childLock: false
                      sound: true
                      lackWater: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /devices/{deviceId}/commands:
    post:
      tags:
        - Devices
      summary: Send device command
      description: |
        Send a control command to a specific device.

        The command structure varies by device type. Each device supports
        different commandType values and parameters.

        **Note:** Some devices may not support command execution via API.
        Virtual infrared devices use "command" while physical devices use
        "commandType".
      operationId: sendDeviceCommand
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Command request structure varies by device type
              properties:
                commandType:
                  type: string
                  description: |
                    Command type for physical devices (e.g., "command", "customize").
                    Use "command" for virtual IR devices.
                  example: command
                command:
                  type: string
                  description: Specific command to execute (varies by device type)
                  example: turnOn
                parameter:
                  oneOf:
                    - type: string
                    - type: integer
                    - type: object
                  description: Command parameters (optional, varies by command)
                  example: default
              required:
                - command
            examples:
              botOn:
                summary: Turn on Bot
                value:
                  commandType: command
                  command: turnOn
                  parameter: default
              humidifierMode:
                summary: Set humidifier to auto mode
                value:
                  commandType: command
                  command: setMode
                  parameter: auto
              curtainPosition:
                summary: Set curtain position to 50%
                value:
                  commandType: command
                  command: setPosition
                  parameter: 0,ff,50
              irAcPowerOn:
                summary: Turn on IR air conditioner
                value:
                  command: turnOn
      responses:
        '200':
          description: Command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                success:
                  value:
                    statusCode: 100
                    message: success
        '400':
          description: Invalid command or device offline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                deviceOffline:
                  value:
                    statusCode: 161
                    message: Device offline
                commandNotSupported:
                  value:
                    statusCode: 160
                    message: Command not supported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenes:
    get:
      tags:
        - Scenes
      summary: Get scene list
      description: |
        Retrieve a list of all manual scenes created in your SwitchBot account.

        Manual scenes are user-defined automation sequences that can be triggered
        via the API or the SwitchBot app.
      operationId: getScenes
      responses:
        '200':
          description: Scene list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      body:
                        type: array
                        description: Array of scene objects
                        items:
                          type: object
                          required:
                            - sceneId
                            - sceneName
                          properties:
                            sceneId:
                              type: string
                              description: Unique scene identifier
                              example: T02-202110151446-12345678
                            sceneName:
                              type: string
                              description: User-defined scene name
                              example: Good Morning
              examples:
                success:
                  value:
                    statusCode: 100
                    message: success
                    body:
                      - sceneId: T02-202110151446-12345678
                        sceneName: Good Morning
                      - sceneId: T02-202110151447-87654321
                        sceneName: Leave Home
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scenes/{sceneId}/execute:
    post:
      tags:
        - Scenes
      summary: Execute scene
      description: |
        Execute a manual scene by its sceneId.

        This triggers all actions defined in the scene, such as turning on/off
        devices, adjusting settings, etc.
      operationId: executeScene
      parameters:
        - $ref: '#/components/parameters/sceneId'
      responses:
        '200':
          description: Scene executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                success:
                  value:
                    statusCode: 100
                    message: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhook/setupWebhook:
    post:
      tags:
        - Webhook
      summary: Setup webhook
      description: |
        Configure a webhook URL to receive device status change notifications.

        When configured, SwitchBot will send POST requests to your webhook URL
        whenever a device's status changes.
      operationId: setupWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - url
              properties:
                action:
                  type: string
                  description: Action type (always "setupWebhook")
                  enum:
                    - setupWebhook
                  example: setupWebhook
                url:
                  type: string
                  format: uri
                  description: Your webhook endpoint URL (must be HTTPS)
                  example: https://example.com/webhook
                deviceList:
                  type: string
                  description: |
                    Comma-separated list of device IDs to monitor.
                    Use "ALL" to monitor all devices.
                  example: ALL
            examples:
              allDevices:
                summary: Setup webhook for all devices
                value:
                  action: setupWebhook
                  url: https://example.com/webhook
                  deviceList: ALL
              specificDevices:
                summary: Setup webhook for specific devices
                value:
                  action: setupWebhook
                  url: https://example.com/webhook
                  deviceList: C271111EC0AB,E2F6032048AB
      responses:
        '200':
          description: Webhook configured successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhook/queryWebhook:
    post:
      tags:
        - Webhook
      summary: Query webhook configuration
      description: Retrieve the current webhook configuration
      operationId: queryWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  description: Action type (always "queryWebhook")
                  enum:
                    - queryWebhook
                  example: queryWebhook
            examples:
              query:
                value:
                  action: queryWebhook
      responses:
        '200':
          description: Webhook configuration retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          urls:
                            type: array
                            items:
                              type: object
                              properties:
                                url:
                                  type: string
                                  format: uri
                                createTime:
                                  type: integer
                                  description: Unix timestamp (milliseconds)
                                lastUpdateTime:
                                  type: integer
                                  description: Unix timestamp (milliseconds)
                                deviceList:
                                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhook/updateWebhook:
    post:
      tags:
        - Webhook
      summary: Update webhook configuration
      description: Modify the existing webhook URL or device list
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - config
              properties:
                action:
                  type: string
                  description: Action type (always "updateWebhook")
                  enum:
                    - updateWebhook
                  example: updateWebhook
                config:
                  type: object
                  required:
                    - url
                  properties:
                    url:
                      type: string
                      format: uri
                      description: New webhook URL
                    deviceList:
                      type: string
                      description: Updated device list
            examples:
              update:
                value:
                  action: updateWebhook
                  config:
                    url: https://example.com/new-webhook
                    deviceList: ALL
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhook/deleteWebhook:
    post:
      tags:
        - Webhook
      summary: Delete webhook
      description: Remove the configured webhook
      operationId: deleteWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - url
              properties:
                action:
                  type: string
                  description: Action type (always "deleteWebhook")
                  enum:
                    - deleteWebhook
                  example: deleteWebhook
                url:
                  type: string
                  format: uri
                  description: Webhook URL to delete
            examples:
              delete:
                value:
                  action: deleteWebhook
                  url: https://example.com/webhook
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    SwitchBotAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        SwitchBot API authentication requires four headers:

        1. **Authorization**: Your access token
        2. **sign**: HMAC-SHA256 signature computed from (token + t + nonce)
        3. **t**: Current timestamp in milliseconds (13-digit Unix timestamp)
        4. **nonce**: Random UUID for replay attack prevention

        Example signature calculation (pseudo-code):
        ```
        const stringToSign = token + t + nonce
        const sign = HMAC_SHA256(secret, stringToSign).toBase64()
        ```

        All four headers must be included in every request.
    SignatureHeader:
      type: apiKey
      in: header
      name: sign
      description: HMAC-SHA256 signature of (token + t + nonce) using your client secret
    TimestampHeader:
      type: apiKey
      in: header
      name: t
      description: Current Unix timestamp in milliseconds (13 digits)
    NonceHeader:
      type: apiKey
      in: header
      name: nonce
      description: Random UUID to prevent replay attacks
  parameters:
    deviceId:
      name: deviceId
      in: path
      required: true
      description: Unique device identifier obtained from GET /devices
      schema:
        type: string
        example: C271111EC0AB
      examples:
        bot:
          value: '210'
          summary: Bot device ID
        curtain:
          value: E2F6032048AB
          summary: Curtain device ID
    sceneId:
      name: sceneId
      in: path
      required: true
      description: Unique scene identifier obtained from GET /scenes
      schema:
        type: string
        example: T02-20200804130110
      examples:
        manual:
          value: T02-202110151446-12345678
          summary: Manual scene ID
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidToken:
              value:
                statusCode: 190
                message: Unauthorized
            signatureError:
              value:
                statusCode: 100
                message: Signature verification failed
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                statusCode: 171
                message: System error
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidParameter:
              value:
                statusCode: 151
                message: Device not found
    Success:
      description: Request successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
    RateLimitExceeded:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tooManyRequests:
              value:
                statusCode: 169
                message: Too many requests
  schemas:
    BaseResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          description: Response status code (100 for success)
          example: 100
        message:
          type: string
          description: Response message
          example: success
        body:
          description: Response payload (structure varies by endpoint)
          oneOf:
            - type: object
            - type: array
    DeviceBase:
      type: object
      description: Common properties for all devices
      required:
        - deviceId
        - deviceName
        - deviceType
        - hubDeviceId
      properties:
        deviceId:
          type: string
          description: Unique device identifier
          example: C271111EC0AB
        deviceName:
          type: string
          description: User-defined device name
          example: Living Room Bot
        deviceType:
          type: string
          description: Device type identifier
          example: Bot
        hubDeviceId:
          type: string
          description: Parent Hub device ID (empty string for Hub devices)
          example: FA7310762361
        enableCloudService:
          type: boolean
          description: Whether cloud service is enabled for this device
          example: true
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          description: |
            Error code indicating the type of failure:
            - 100: Signature verification failed
            - 151: Device not found
            - 152: Device type not supported
            - 160: Command not supported
            - 161: Device offline
            - 162: Device internal error
            - 169: Too many requests
            - 171: System error
            - 190: Unauthorized / Invalid token
          enum:
            - 100
            - 151
            - 152
            - 160
            - 161
            - 162
            - 169
            - 171
            - 190
          example: 190
        message:
          type: string
          description: Human-readable error message
          example: Unauthorized
