schemas:
  PresenceSensorDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Presence Sensor
            example: "Presence Sensor"

  PresenceSensorStatus:
    type: object
    description: Presence Sensor device status
    required:
      - deviceId
      - deviceType
      - presenceDetected
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Presence Sensor
        example: "Presence Sensor"
      presenceDetected:
        type: boolean
        description: Whether presence is currently detected
        example: true
      battery:
        type: integer
        description: Battery level percentage
        minimum: 0
        maximum: 100
        example: 90

  PresenceSensorWebhookEvent:
    type: object
    description: Presence Sensor webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - presenceDetected
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Presence Sensor
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          presenceDetected:
            type: boolean
          battery:
            type: integer
            minimum: 0
            maximum: 100
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
