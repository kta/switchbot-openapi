schemas:
  PlugMiniDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        description: Plug Mini devices (US/JP/EU variants share the same schema)
        properties:
          deviceType:
            type: string
            enum:
              - Plug Mini (US)
              - Plug Mini (JP)
              - Plug Mini (EU)
            example: "Plug Mini (US)"

  PlugMiniStatus:
    type: object
    description: Plug Mini device status (compatible with all regional variants)
    required:
      - deviceId
      - deviceType
      - power
    properties:
      deviceId:
        type: string
        example: "84F70353A4D1"
      deviceType:
        type: string
        enum:
          - Plug Mini (US)
          - Plug Mini (JP)
          - Plug Mini (EU)
        example: "Plug Mini (US)"
      power:
        type: string
        enum:
          - "on"
          - "off"
      voltage:
        type: number
      weight:
        type: number
      electricCurrent:
        type: number

  PlugMiniCommand:
    type: object
    required:
      - commandType
      - command
    properties:
      commandType:
        type: string
        enum:
          - command
      command:
        type: string
        enum:
          - turnOn
          - turnOff
          - toggle
      parameter:
        type: string
        enum:
          - default

  PlugMiniWebhookEvent:
    type: object
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
      eventVersion:
        type: string
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - power
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Plug Mini (US)
              - Plug Mini (JP)
              - Plug Mini (EU)
          deviceMac:
            type: string
            description: Device MAC address
            example: "84F70353A4D1"
          power:
            type: string
            enum:
              - "on"
              - "off"
          voltage:
            type: number
            description: Current voltage
          weight:
            type: number
            description: Power consumption in W
          electricCurrent:
            type: number
            description: Current in A
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
