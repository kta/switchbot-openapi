schemas:
  KeypadVisionDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Keypad Vision
            example: "Keypad Vision"

  KeypadVisionProDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Keypad Vision Pro
            example: "Keypad Vision Pro"

  KeypadVisionStatus:
    type: object
    description: Keypad Vision device status
    required:
      - deviceId
      - deviceType
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Keypad Vision
          - Keypad Vision Pro
        example: "Keypad Vision"
      battery:
        type: integer
        description: Battery level percentage
        minimum: 0
        maximum: 100
        example: 90

  KeypadVisionWebhookEvent:
    type: object
    description: Keypad Vision webhook event payload (battery status changes)
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Keypad Vision
              - Keypad Vision Pro
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          battery:
            type: integer
            minimum: 0
            maximum: 100
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
