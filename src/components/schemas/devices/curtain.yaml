schemas:
  CurtainDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Curtain
              - Curtain3
            example: "Curtain"
          curtainDevicesIds:
            type: array
            description: List of Curtain device IDs (for paired curtains)
            items:
              type: string
            example: ["E2F6032048AB", "E2F6032048AC"]
          calibrate:
            type: boolean
            description: Whether the curtain is calibrated
            example: true
          group:
            type: boolean
            description: Whether the curtain is in a group
            example: false
          master:
            type: boolean
            description: Whether this is the master curtain in a group
            example: true
          openDirection:
            type: string
            description: Direction curtain opens
            enum:
              - left
              - right
            example: "left"

  CurtainStatus:
    type: object
    description: Curtain device status
    required:
      - deviceId
      - deviceType
      - slidePosition
      - moving
    properties:
      deviceId:
        type: string
        example: "E2F6032048AB"
      deviceType:
        type: string
        enum:
          - Curtain
          - Curtain3
        example: "Curtain"
      slidePosition:
        type: integer
        description: Current position (0=closed, 100=open)
        minimum: 0
        maximum: 100
        example: 50
      moving:
        type: boolean
        description: Whether the curtain is currently moving
        example: false
      brightness:
        type: string
        description: Brightness level detected by light sensor
        enum:
          - bright
          - dim
        example: "bright"
      battery:
        type: integer
        description: Battery level percentage (0-100)
        minimum: 0
        maximum: 100
        example: 90
      calibrate:
        type: boolean
        description: Whether the curtain is calibrated
        example: true
      group:
        type: boolean
        description: Whether the curtain is in a group
        example: false
      version:
        type: integer
        description: Firmware version
        example: 4

  CurtainCommand:
    type: object
    description: Curtain device command
    required:
      - commandType
      - command
    properties:
      commandType:
        type: string
        description: Command type
        enum:
          - command
        example: "command"
      command:
        type: string
        description: |
          Command to execute:
          - turnOn: Open curtain
          - turnOff: Close curtain
          - setPosition: Set to specific position
        enum:
          - turnOn
          - turnOff
          - setPosition
        example: "setPosition"
      parameter:
        type: string
        description: |
          Command parameter:
          - For turnOn/turnOff: "default"
          - For setPosition: "0,ff,<position>" where position is 0-100
            Example: "0,ff,50" sets position to 50%
        example: "0,ff,50"

  CurtainWebhookEvent:
    type: object
    description: Curtain webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - slidePosition
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Curtain
              - Curtain3
          deviceMac:
            type: string
            description: Device MAC address
            example: "E2F6032048AB"
          slidePosition:
            type: integer
            minimum: 0
            maximum: 100
          moving:
            type: boolean
          brightness:
            type: string
            enum:
              - bright
              - dim
          battery:
            type: integer
            minimum: 0
            maximum: 100
          calibrate:
            type: boolean
          group:
            type: boolean
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
