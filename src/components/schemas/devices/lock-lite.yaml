schemas:
  LockLiteDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Smart Lock Lite
            example: "Smart Lock Lite"

  LockLiteStatus:
    type: object
    description: Smart Lock Lite device status
    required:
      - deviceId
      - deviceType
      - lockState
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Smart Lock Lite
        example: "Smart Lock Lite"
      lockState:
        type: string
        description: Current lock state
        enum:
          - locked
          - unlocked
          - jammed
        example: "locked"
      battery:
        type: integer
        description: Battery level percentage
        minimum: 0
        maximum: 100
        example: 85

  LockLiteCommand:
    type: object
    description: Smart Lock Lite device command
    required:
      - commandType
      - command
    properties:
      commandType:
        type: string
        description: Command type
        enum:
          - command
        example: "command"
      command:
        type: string
        description: |
          Command to execute:
          - lock: Lock the door
          - unlock: Unlock the door
        enum:
          - lock
          - unlock
        example: "lock"
      parameter:
        type: string
        enum:
          - default
        example: "default"

  LockLiteWebhookEvent:
    type: object
    description: Smart Lock Lite webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - lockState
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Smart Lock Lite
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          lockState:
            type: string
            enum:
              - locked
              - unlocked
              - jammed
          battery:
            type: integer
            minimum: 0
            maximum: 100
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
