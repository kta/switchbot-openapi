schemas:
  WaterLeakDetectorDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Water Leak Detector
            example: "Water Leak Detector"

  WaterLeakDetectorStatus:
    type: object
    description: Water Leak Detector device status
    required:
      - deviceId
      - deviceType
      - leakDetected
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Water Leak Detector
        example: "Water Leak Detector"
      leakDetected:
        type: boolean
        description: Whether water leak is currently detected
        example: false
      battery:
        type: integer
        description: Battery level percentage
        minimum: 0
        maximum: 100
        example: 85

  WaterLeakDetectorWebhookEvent:
    type: object
    description: Water Leak Detector webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - leakDetected
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Water Leak Detector
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          leakDetected:
            type: boolean
          battery:
            type: integer
            minimum: 0
            maximum: 100
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
