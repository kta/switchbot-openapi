schemas:
  CeilingLightDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Ceiling Light
            example: "Ceiling Light"

  CeilingLightProDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Ceiling Light Pro
            example: "Ceiling Light Pro"

  CeilingLightStatus:
    type: object
    description: Ceiling Light device status
    required:
      - deviceId
      - deviceType
      - power
      - brightness
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Ceiling Light
          - Ceiling Light Pro
        example: "Ceiling Light"
      power:
        type: string
        description: Power state
        enum:
          - "on"
          - "off"
        example: "on"
      brightness:
        type: integer
        description: Brightness level (1-100)
        minimum: 1
        maximum: 100
        example: 75
      colorTemperature:
        type: integer
        description: Color temperature in Kelvin (2700-6500)
        minimum: 2700
        maximum: 6500
        example: 4000

  CeilingLightCommand:
    type: object
    description: Ceiling Light device command
    required:
      - commandType
      - command
    properties:
      commandType:
        type: string
        description: Command type
        enum:
          - command
        example: "command"
      command:
        type: string
        description: |
          Command to execute:
          - turnOn: Turn on the ceiling light
          - turnOff: Turn off the ceiling light
          - setBrightness: Set brightness level
          - setColorTemperature: Set color temperature
        enum:
          - turnOn
          - turnOff
          - setBrightness
          - setColorTemperature
        example: "setBrightness"
      parameter:
        oneOf:
          - type: string
            description: For turnOn/turnOff
            enum:
              - default
          - type: integer
            description: For setBrightness (1-100) or setColorTemperature (2700-6500)
            minimum: 1
        example: 75

  CeilingLightWebhookEvent:
    type: object
    description: Ceiling Light webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - power
          - brightness
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Ceiling Light
              - Ceiling Light Pro
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          power:
            type: string
            enum:
              - "on"
              - "off"
          brightness:
            type: integer
            minimum: 1
            maximum: 100
          colorTemperature:
            type: integer
            minimum: 2700
            maximum: 6500
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
