schemas:
  OutdoorMeterDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Outdoor Meter
            example: "Outdoor Meter"

  OutdoorMeterStatus:
    type: object
    description: Outdoor Meter device status
    required:
      - deviceId
      - deviceType
      - temperature
      - humidity
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Outdoor Meter
        example: "Outdoor Meter"
      temperature:
        type: number
        description: Temperature in Celsius
        example: 25.5
      humidity:
        type: integer
        description: Relative humidity percentage
        minimum: 0
        maximum: 100
        example: 65
      battery:
        type: integer
        description: Battery level percentage
        minimum: 0
        maximum: 100
        example: 80

  OutdoorMeterWebhookEvent:
    type: object
    description: Outdoor Meter webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - temperature
          - humidity
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Outdoor Meter
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          temperature:
            type: number
            description: Temperature in Celsius
          humidity:
            type: integer
            minimum: 0
            maximum: 100
          battery:
            type: integer
            minimum: 0
            maximum: 100
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
