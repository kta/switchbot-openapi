schemas:
  GarageDoorOpenerDevice:
    allOf:
      - $ref: '../common.yaml#/schemas/DeviceBase'
      - type: object
        properties:
          deviceType:
            type: string
            enum:
              - Garage Door Opener
            example: "Garage Door Opener"

  GarageDoorOpenerStatus:
    type: object
    description: Garage Door Opener device status
    required:
      - deviceId
      - deviceType
      - doorState
    properties:
      deviceId:
        type: string
        example: "A1B2C3D4E5F6"
      deviceType:
        type: string
        enum:
          - Garage Door Opener
        example: "Garage Door Opener"
      doorState:
        type: string
        description: Current door state
        enum:
          - closed
          - opened
          - closing
          - opening
        example: "closed"
      calibrate:
        type: boolean
        description: Whether calibration is needed
      battery:
        type: integer
        description: Battery level percentage
        minimum: 0
        maximum: 100
        example: 95

  GarageDoorOpenerCommand:
    type: object
    description: Garage Door Opener device command
    required:
      - commandType
      - command
    properties:
      commandType:
        type: string
        description: Command type
        enum:
          - command
        example: "command"
      command:
        type: string
        description: |
          Command to execute:
          - open: Open the garage door
          - close: Close the garage door
        enum:
          - open
          - close
        example: "open"
      parameter:
        type: string
        enum:
          - default
        example: "default"

  GarageDoorOpenerWebhookEvent:
    type: object
    description: Garage Door Opener webhook event payload
    required:
      - eventType
      - eventVersion
      - context
    properties:
      eventType:
        type: string
        enum:
          - changeReport
        example: "changeReport"
      eventVersion:
        type: string
        example: "1"
      context:
        type: object
        required:
          - deviceType
          - deviceMac
          - doorState
          - timeOfSample
        properties:
          deviceType:
            type: string
            enum:
              - Garage Door Opener
          deviceMac:
            type: string
            description: Device MAC address
            example: "A1B2C3D4E5F6"
          doorState:
            type: string
            enum:
              - closed
              - opened
              - closing
              - opening
          calibrate:
            type: boolean
          battery:
            type: integer
            minimum: 0
            maximum: 100
          timeOfSample:
            type: integer
            description: Unix timestamp in milliseconds
            example: 1658123456789
