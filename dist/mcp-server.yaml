          example: 2
        mode:
          type: string
          description: Operation mode
          enum:
            - auto
            - manual
            - sleep
          example: auto
  - name: AirPurifierVOC_turnOn
    description: Turn on the air purifier - Air Purifier VOC
    category: Air Purifier VOC
    input:
      type: object
