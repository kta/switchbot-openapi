name: SwitchBot MCP Server
version: 1.1.0
description: |
  Official OpenAPI specification for SwitchBot API v1.1

  This specification is automatically synchronized with the official SwitchBot README documentation.

  For the latest official documentation, visit: https://github.com/OpenWonderLabs/SwitchBotAPI
server:
  baseUrl: https://api.switch-bot.com/v1.1
  authentication:
    type: custom
    description: "SwitchBot API requires four headers: Authorization (token), sign (HMAC-SHA256), t (timestamp), nonce (UUID)"
    headers:
      - name: Authorization
        description: Access token
        required: true
      - name: sign
        description: HMAC-SHA256 signature
        required: true
      - name: t
        description: Unix timestamp in milliseconds
        required: true
      - name: nonce
        description: Random UUID
        required: true
tools:
  - name: getAIArtFrameStatus
    description: Get current status of AI Art Frame device
    category: AI Art Frame
    input:
      type: object
      properties:
        deviceId:
          type: string
          description: Device ID of the AI Art Frame
      required:
        - deviceId
    endpoint:
      method: GET
      path: /devices/{deviceId}/status
    output:
      description: Current status of AI Art Frame
      schema:
        power:
          type: string
          description: Power state
          enum:
            - on
            - off
          example: on
        brightness:
          type: integer
          description: Screen brightness (0-100)
          example: 75
        currentArt:
          type: string
          description: Currently displayed artwork ID
  - name: getAIHubStatus
    description: Get current status of AI Hub device
    category: AI Hub
    input:
      type: object
      properties:
        deviceId:
          type: string
          description: Device ID of the AI Hub
      required:
        - deviceId
    endpoint:
      method: GET
      path: /devices/{deviceId}/status
    output:
      description: Current status of AI Hub
      schema:
        temperature:
          type: number
          description: Temperature in Celsius
          example: 24
        humidity:
          type: integer
          description: Relative humidity percentage
          example: 60
        lightLevel:
          type: integer
          description: Light level (1-bright, 2-dim)
          enum:
            - 1
            - 2
          example: 1
        version:
          type: integer
          description: Firmware version
          example: 50
